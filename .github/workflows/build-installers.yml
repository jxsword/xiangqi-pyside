name: build-installers

# 中国象棋（Python / PySide6 6.8.3）三平台构建
# 产物：Linux AppImage + deb、Windows NSIS 安装包、macOS .app（tar.gz）
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  APP_NAME: xiangqi-pyside
  APP_VERSION: '0.1.0'
  PYTHON_VERSION: '3.12'

jobs:
  # ============ Linux（AppImage + deb）============
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-cursor0 libgl1 libegl1 libfontconfig1 libdbus-1-3 file

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行单元测试
        run: python -m unittest tests.test_rules
        env:
          QT_QPA_PLATFORM: offscreen

      - name: PyInstaller 打包（onedir）
        run: pyinstaller packaging/xiangqi.spec --noconfirm

      - name: 缓存 appimagetool（约 8.5MB，未跟踪入库，命中则跳过下载）
        uses: actions/cache@v4
        with:
          path: tools/appimagetool
          key: appimagetool-x86_64-v1

      - name: 生成 AppImage
        run: ./tools/build_appimage.sh ${APP_VERSION}

      - name: 生成 deb
        run: ./tools/build_deb.sh ${APP_VERSION}

      - uses: actions/upload-artifact@v4
        with:
          name: linux-installers
          path: |
            *.AppImage
            *.deb

  # ============ Windows（NSIS 安装包，原生构建）============
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行单元测试
        run: python -m unittest tests.test_rules

      - name: PyInstaller 打包（onedir）
        run: pyinstaller packaging/xiangqi.spec --distpath dist-win --workpath build-win --noconfirm

      - name: 安装 NSIS 并生成安装包
        shell: bash
        run: |
          choco install nsis -y --no-progress
          cp tools/installer.nsi ./installer.nsi
          "/c/Program Files (x86)/NSIS/makensis.exe" installer.nsi

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: ${{ env.APP_NAME }}_${{ env.APP_VERSION }}_x64-setup.exe

  # ============ macOS（绿色 .app，tar.gz）============
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行单元测试
        run: python -m unittest tests.test_rules

      - name: PyInstaller 打包（.app）
        run: pyinstaller packaging/xiangqi.spec --noconfirm

      - name: 打包 tar.gz
        run: tar -czf ${APP_NAME}_${APP_VERSION}_macos.tar.gz -C dist ${APP_NAME}.app

      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: "*.tar.gz"

  # ============ 发布：构建二进制上传到 GitHub Release（仅 v* tag 触发）============
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [linux, windows, macos]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: 发布到 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          # 重跑时同名 Release 已存在，create 失败属正常，随后用 --clobber 覆盖资产
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --title "xiangqi-pyside ${TAG}" \
            --notes "中国象棋（Python / PySide6）三平台安装包：Linux AppImage+deb、Windows NSIS、macOS .app" \
            || true
          gh release upload "$TAG" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
